<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    //bai 1: Viết chương trình hiển thị chuỗi “The number is N” 5 lần sử dụng vòng lặp for. Với N sẽ hiển thị từ 0 đến 5.
    for (let i = 0;i<=5;i++){
        console.log(i);
    }
    //Bai 2: Viết chương trình nhập vào một số bất kỳ lớn hơn 0. Tính tổng các phần tử từ 1 đến số vừa nhập vào.
    let number = parseInt(prompt("Enter a number"));
    let count = 0;
    if (number <= 0){
        alert("Please enter a number greater than 0");
    }
    for (i = 1; i<=number;i++){
        count += i;
    }
    console.log(count);
</script>
</body>
</html>
