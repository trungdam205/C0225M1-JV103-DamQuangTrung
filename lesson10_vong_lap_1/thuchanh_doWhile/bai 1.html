<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--Tạo file dowhilesample.html. Tạo thẻ <script> và viết các mã lệnh thực thi trong đó.-->
<script>
  //Sử dụng vòng lặp do while để viết lại chương trình yêu cầu nhập các số từ 1 -> 10 ở ví dụ trong phần vòng lặp while.
  let value = null;
  do {
    value = prompt("Enter number from 1 to 10:");
  } while (value < 1 || value > 10);
  alert("Số bạn vừa nhập là " + value);
</script>
</body>
</html>
