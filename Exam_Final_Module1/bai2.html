<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    // Tinh Tổng Ước Số
    function tongUocSo(n) {
        let sum = 0;
        for (let i = 1; i <= n / 2; i++) {
            if (n % i === 0) sum += i;
        }
        return sum;
    }

    //Kiểm tra xem có phải cắp số thân thiêt không ?
    function capSoThanThiet(soDauTien, soThuHai) {
        if (soDauTien <= 0 || soThuHai <= 0) return false;

        let tong1 = tongUocSo(soDauTien);
        let tong2 = tongUocSo(soThuHai);

        return tong1 === soThuHai && tong2 === soDauTien;
    }

    console.log("220 và 284 là cặp thân thiết?", capSoThanThiet(220, 284));
    console.log("123 và 456 là cặp thân thiết?", capSoThanThiet(123, 456));


</script>
</body>
</html>
