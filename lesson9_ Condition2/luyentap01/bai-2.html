<body>
<script>
  let age = +prompt("Enter your age");
  if(isNaN(age)){
   alert("Not a number");
  }
  else if (age >= 16){
    document.write("Đủ Điều Kiện Vào Lớp 10.");
  }else{
    document.write("Không Đủ Điều Kiện Vào Lớp 10")
  }


</script>
