<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--Nhập 3 số nguyên, tìm và in ra giá trị lớn nhất trong ba số đó.-->
<script>
  let number1 = Number(prompt("Enter a number 1:"));
  let number2 = Number(prompt("Enter a number 2"));
  let number3 = Number(prompt("Enter a number 3"));
  if (isNaN(number1) || isNaN(number2) || isNaN(number3)) {
    alert("Not a number");
  }
  if (number1 == number2 && number2 == number3){
      document.write("Ba số bằng nhau.")
  }
  else if (number1 > number2 && number1 > number3){
      document.write("số 1 là số lớn nhất");
  }else if (number2 > number1 && number2 > number3) {
      document.write("Số 2 là số lớn nhất")
  }else if (number3 > number1 && number3 > number2){
    document.write("Số 3 là số lớn nhất")
  }
</script>
</body>
</html>
